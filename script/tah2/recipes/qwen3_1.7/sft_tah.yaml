### run ###
seed: 42        # all RNG (random/numpy/torch/transformers); read by SFT_TaH.py

### model ###
model:
  name: Qwen/Qwen3-1.7B-Base
  torch_dtype: "bfloat16"
  device_map: "auto"
  trust_remote_code: true
  iter_attention_mode: "duo"
  iter_attention_impl: "triton"
  attn_implementation: "sdpa"
  embedding_key: "model.embed_tokens"
  weighted_hidden_method: "stop_prob_mix"   # stop_prob_mix or even_mix
  memory_lean_fp32_reductions: true
  max_iter: 2
  iter_label_generator: "DynamicIterLabelGenerator"
  iter_label_generator_kwargs:
    abs_improv_coverage: 0.99
  input_updater: "Qwen3MLPUpdater"
  input_updater_kwargs:
    hidden_size: 2048
    intermediate_size: 2048
  iter_decider: "Qwen3MLPIterDecider"
  iter_decider_kwargs:
    hidden_size: 2048
    intermediate_size: 2048
    threshold: 0.5
    topk: 2048
  eval_iter_decider: "iter_decider"
  train_loss: CombinedLoss
  train_loss_kwargs:
    losses:
      - name: "NextTokenPredLoss"
        weight: 1.0
        kwargs:
          use_target_gather_mix: true   # K=1 fp32 mixture CE; no (B,L,V) buffer
      - name: "IterDeciderLoss"
        weight: 0.05
        kwargs:
          dyn_pos_weight: true
          cost_sensitive: true              # cost sensitive mode if true
  eval_loss: "NextTokenPredLoss"

### data ###
data:
  train_data_path: data/1.7b/train
  eval_data_path: data/1.7b/eval
  output_dir: "output/amteam_tool/1_7"
  even_strategy: "drop"
  dp: 8
  max_length: 16384
  max_length_action: "cutoff"

### training ###
training:
  num_train_epochs: 3
  dynamic_batch:
    enabled: true
    global_batch_samples: 128
    token_budget: 16384
    max_batch_size: 32
  gradient_checkpointing: true
  learning_rate: 4.0e-5
  weight_decay: 0.01
  warmup_ratio: 0.03
  max_grad_norm: 1.0
  lr_scheduler_type: "cosine_with_min_lr"
  lr_scheduler_kwargs:
    min_lr_rate: 0.1
  logging_steps: 1
  save_strategy: "epoch"
  save_only_model: true
  save_total_limit: 50
  bf16: true
  # evaluation
  eval_strategy: "steps"
  eval_steps: 120
  eval_on_start: false
  per_device_eval_batch_size: 1
  # wandb config
  report_to: ""
  wandb_project: ""
  wandb_name: ""
